<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            const [homeSubView, setHomeSubView] = React.useState(null);

            const initialGroups = {
                'গ্রুপ এ': [
                    { teamName: 'টিম আলফা', category: 'HIGH', player1: 'রফিক হোসেন', phone1: '01700000001', player2: 'শফিক আহমেদ', phone2: '01700000002', address: 'ঢাকা' },
                    { teamName: 'টিম বিটা', category: 'MEDIUM', player1: 'আলমগীর কবির', phone1: '01800000001', player2: 'জহির রায়হান', phone2: '01800000002', address: 'গাজীপুর' },
                    { teamName: 'টিম গামা', category: 'LOW', player1: 'তানভীর হাসান', phone1: '01900000001', player2: 'সাব্বির খান', phone2: '01900000002', address: 'নারায়ণগঞ্জ' }
                ],
                'গ্রুপ বি': [
                    { teamName: 'টিম রয়্যাল', category: 'HIGH', player1: 'কাজী সালাউদ্দিন', phone1: '01711111111', player2: 'এম এ জলিল', phone2: '01711111112', address: 'চট্টগ্রাম' },
                    { teamName: 'টিম কিং', category: 'MEDIUM', player1: 'সাকিব মেহমুদ', phone1: '01811111111', player2: 'আরিফ রহমান', phone2: '01811111112', address: 'কুমিল্লা' },
                    { teamName: 'টিম ঈগল', category: 'LOW', player1: 'মেহেদী হাসান', phone1: '01911111111', player2: 'রাকিব শাহ', phone2: '01911111112', address: 'সিলেট' }
                ],
                'গ্রুপ সি': [
                    { teamName: 'টিম থান্ডার', category: 'HIGH', player1: 'শাহিন আলম', phone1: '01722222221', player2: 'ইমরান খান', phone2: '01722222222', address: 'খুলনা' },
                    { teamName: 'টিম টাইগার', category: 'MEDIUM', player1: 'সোহেল রানা', phone1: '01822222221', player2: 'কামরুল ইসলাম', phone2: '01822222222', address: 'বরিশাল' },
                    { teamName: 'টিম স্টর্ম', category: 'LOW', player1: 'ফাহিম আহমেদ', phone1: '01922222221', player2: 'নাসিম শেখ', phone2: '01922222222', address: 'যশোর' }
                ],
                'গ্রুপ ডি': [
                    { teamName: 'টিম ফিনিক্স', category: 'HIGH', player1: 'হাবিবুর রহমান', phone1: '01733333331', player2: 'আনোয়ার হোসেন', phone2: '01733333332', address: 'রংপুর' },
                    { teamName: 'টিম ওয়্যারিয়র্স', category: 'MEDIUM', player1: 'আসিফ ইকবাল', phone1: '01833333331', player2: 'নাইমুল ইসলাম', phone2: '01833333332', address: 'বগুড়া' },
                    { teamName: 'টিম শাইন', category: 'LOW', player1: 'রিয়াদ হোসেন', phone1: '01933333331', player2: 'তাহসিন মাহমুদ', phone2: '01933333332', address: 'ময়মনসিংহ' }
                ]
            };

            const [groupsData, setGroupsData] = React.useState(initialGroups);

            const [notices, setNotices] = React.useState([
                { id: 1, text: "উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ এর রেজিষ্ট্রেশন ও গ্রুপ বণ্টন সম্পন্ন হয়েছে!", date: "২০২৬-০৩-০১" }
            ]);
            const [newNotice, setNewNotice] = React.useState('');

            const [matches, setMatches] = React.useState([
                { id: 1, match: 'টিম আলফা (গ্রুপ এ) বনাম টিম বিটা (গ্রুপ এ)', stage: 'গ্রুপ পর্ব', time: '২০২৬-০৩-১৫, বিকেল ৪:০০ টা', score: 'আসন্ন' },
                { id: 2, match: 'টিম রয়্যাল (গ্রুপ বি) বনাম টিম কিং (গ্রুপ বি)', stage: 'গ্রুপ পর্ব', time: '২০২৬-০৩-১৫, বিকেল ৫:০০ টা', score: 'আসন্ন' }
            ]);

            const [teamForm, setTeamForm] = React.useState({
                group: 'গ্রুপ এ', teamName: '', category: 'HIGH', player1: '', phone1: '', player2: '', phone2: '', address: ''
            });

            const [matchForm, setMatchForm] = React.useState({
                match: '', stage: 'গ্রুপ পর্ব', time: '', score: 'আসন্ন'
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (email === 'efshikhelaghor@gmail.com' && password === 'admin123') {
                    setIsAdmin(true);
                    setLoginError('');
                    setActiveTab('dashboard');
                } else {
                    setLoginError('ভুল ইমেইল বা পাসওয়ার্ড!');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                setEmail('');
                setPassword('');
                setActiveTab('home');
                setHomeSubView(null);
            };

            const addTeamToGroup = (e) => {
                e.preventDefault();
                if (teamForm.teamName && teamForm.player1 && teamForm.player2) {
                    const group = teamForm.group;
                    const updatedGroup = [...(groupsData[group] || []), teamForm];
                    setGroupsData({ ...groupsData, [group]: updatedGroup });
                    setTeamForm({ group: 'গ্রুপ এ', teamName: '', category: 'HIGH', player1: '', phone1: '', player2: '', phone2: '', address: '' });
                }
            };

            const deleteTeamFromGroup = (group, index) => {
                const updatedGroup = groupsData[group].filter((_, i) => i !== index);
                setGroupsData({ ...groupsData, [group]: updatedGroup });
            };

            const addNotice = (e) => {
                e.preventDefault();
                if (newNotice.trim()) {
                    setNotices([{ id: Date.now(), text: newNotice, date: new Date().toISOString().split('T')[0] }, ...notices]);
                    setNewNotice('');
                }
            };

            const deleteNotice = (id) => {
                setNotices(notices.filter(n => n.id !== id));
            };

            const addMatch = (e) => {
                e.preventDefault();
                if (matchForm.match) {
                    setMatches([...matches, { ...matchForm, id: Date.now() }]);
                    setMatchForm({ match: '', stage: 'গ্রুপ পর্ব', time: '', score: 'আসন্ন' });
                }
            };

            const deleteMatch = (id) => {
                setMatches(matches.filter(m => m.id !== id));
            };

            const getAllTeams = () => {
                let list = [];
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        list.push({ ...t, groupName: g });
                    });
                });
                return list;
            };

            const getAllPlayers = () => {
                let list = [];
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        list.push({ name: t.player1, phone: t.phone1, category: t.category, teamName: t.teamName, groupName: g });
                        list.push({ name: t.player2, phone: t.phone2, category: t.category, teamName: t.teamName, groupName: g });
                    });
                });
                return list;
            };

            const getCategoryBadge = (cat) => {
                let color = "bg-gray-700 text-gray-200 border-gray-600";
                if (cat === 'HIGH') color = "bg-red-500/20 text-red-400 border-red-500/30";
                else if (cat === 'MEDIUM') color = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30";
                else if (cat === 'LOW') color = "bg-green-500/20 text-green-400 border-green-500/30";
                return <span className={`px-2 py-0.5 rounded text-xs border font-semibold ${color}`}>{cat}</span>;
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 text-gray-100 font-sans">
                    <header className="bg-slate-800 shadow-md p-4 border-b border-yellow-500 flex justify-between items-center px-4 md:px-6">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-yellow-400">👑 উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং 👑</h1>
                            <p className="text-xs md:text-sm text-gray-300 mt-0.5">
                                টুর্নামেন্ট ম্যানেজমেন্ট সিস্টেম {isAdmin && <span className="bg-red-600 px-2 py-0.5 rounded text-xs ml-2 text-white font-bold">এডমিন মোড</span>}
                            </p>
                        </div>
                        <div>
                            {isAdmin ? (
                                <button onClick={handleLogout} className="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded text-sm font-semibold transition">লগআউট</button>
                            ) : (
                                <button onClick={() => setActiveTab('admin')} className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-3 py-1.5 rounded text-sm font-semibold transition">এডমিন লগইন</button>
                            )}
                        </div>
                    </header>

                    <nav className="flex justify-center bg-slate-800 p-2 gap-2 md:gap-4 flex-wrap border-b border-slate-700">
                        <button onClick={() => { setActiveTab('home'); setHomeSubView(null); }} className={`px-4 py-2 rounded font-semibold text-sm transition ${activeTab === 'home' ? 'bg-yellow-500 text-gray-900' : 'bg-slate-700 text-white hover:bg-slate-600'}`}>হোম ও নোটিশ</button>
                        <button onClick={() => setActiveTab('groups')} className={`px-4 py-2 rounded font-semibold text-sm transition ${activeTab === 'groups' ? 'bg-yellow-500 text-gray-900' : 'bg-slate-700 text-white hover:bg-slate-600'}`}>গ্রুপ ও খেলোয়াড়বৃন্দ</button>
                        <button onClick={() => setActiveTab('matches')} className={`px-4 py-2 rounded font-semibold text-sm transition ${activeTab === 'matches' ? 'bg-yellow-500 text-gray-900' : 'bg-slate-700 text-white hover:bg-slate-600'}`}>ম্যাচ ফিক্সচার</button>
                        {isAdmin && <button onClick={() => { setActiveTab('dashboard'); setHomeSubView(null); }} className={`px-4 py-2 rounded font-semibold text-sm transition ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'bg-red-800 text-white hover:bg-red-700'}`}>এডমিন প্যানেল</button>}
                    </nav>

                    <main className="flex-grow p-4 md:p-6 max-w-6xl mx-auto w-full space-y-6">

                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-xl border border-yellow-500/30 shadow-lg">
                                    <h2 className="text-xl font-bold text-yellow-400 mb-4 flex items-center gap-2">📢 নোটিশ ও ঘোষণা</h2>
                                    <div className="space-y-3">
                                        {notices.map(n => (
                                            <div key={n.id} className="bg-slate-700/60 p-4 rounded-lg border border-slate-600">
                                                <p className="text-gray-200 text-base">{n.text}</p>
                                                <span className="text-xs text-gray-400 mt-2 block">তারিখ: {n.date}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div onClick={() => setHomeSubView('all_groups')} className="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center cursor-pointer hover:border-yellow-500 transition shadow-lg group">
                                        <h3 className="text-lg font-bold text-yellow-400 group-hover:underline">মোট গ্রুপ</h3>
                                        <p className="text-3xl font-extrabold text-white mt-2">{Object.keys(groupsData).length} টি</p>
                                        <span className="text-xs text-yellow-300 mt-2 block">👉 ৪টি গ্রুপ দেখতে চাপ দিন</span>
                                    </div>
                                    <div onClick={() => setHomeSubView('all_teams')} className="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center cursor-pointer hover:border-yellow-500 transition shadow-lg group">
                                        <h3 className="text-lg font-bold text-yellow-400 group-hover:underline">মোট টিম</h3>
                                        <p className="text-3xl font-extrabold text-white mt-2">{getAllTeams().length} টি</p>
                                        <span className="text-xs text-yellow-300 mt-2 block">👉 ১২টি টিম ও ক্যাটাগরি দেখতে চাপ দিন</span>
                                    </div>
                                    <div onClick={() => setHomeSubView('all_players')} className="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center cursor-pointer hover:border-yellow-500 transition shadow-lg group">
                                        <h3 className="text-lg font-bold text-yellow-400 group-hover:underline">মোট খেলোয়াড়</h3>
                                        <p className="text-3xl font-extrabold text-white mt-2">{getAllPlayers().length} জন</p>
                                        <span className="text-xs text-yellow-300 mt-2 block">👉 ২৪ জন খেলোয়াড় দেখতে চাপ দিন</span>
                                    </div>
                                </div>

                                {homeSubView && (
                                    <div className="bg-slate-800 p-6 rounded-xl border border-yellow-500 shadow-2xl space-y-4">
                                        <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                            <h3 className="text-lg font-bold text-yellow-400">
                                                {homeSubView === 'all_groups' && '📁 ৪টি গ্রুপের নামসমূহ'}
                                                {homeSubView === 'all_teams' && '🛡️ ১২টি টিমের তালিকা (HIGH/MEDIUM/LOW ক্যাটাগরি সহ)'}
                                                {homeSubView === 'all_players' && '👥 ২৪ জন খেলোয়াড়ের তালিকা (ক্যাটাগরি সহ)'}
                                            </h3>
                                            <button onClick={() => setHomeSubView(null)} className="bg-red-500 text-white text-xs px-3 py-1 rounded">বন্ধ করুন ✕</button>
                                        </div>

                                        {homeSubView === 'all_groups' && (
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                {Object.keys(groupsData).map((g, i) => (
                                                    <div key={i} className="bg-slate-700 p-4 rounded-lg text-center border border-slate-600">
                                                        <h4 className="font-bold text-yellow-400 text-lg">{g}</h4>
                                                        <p className="text-xs text-gray-300 mt-1">{groupsData[g].length}টি টিম অন্তর্ভুক্ত</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {homeSubView === 'all_teams' && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {getAllTeams().map((t, i) => (
                                                    <div key={i} className="bg-slate-700 p-4 rounded-xl border border-slate-600 space-y-2">
                                                        <div className="flex justify-between items-center border-b border-slate-600 pb-1.5">
                                                            <h4 className="font-bold text-white text-base">{t.teamName}</h4>
                                                            {getCategoryBadge(t.category)}
                                                        </div>
                                                        <p className="text-xs text-yellow-300">গ্রুপ: {t.groupName}</p>
                                                        <div className="text-xs text-gray-300 space-y-0.5">
                                                            <p>👤 খেলোয়াড় ১: <strong className="text-white">{t.player1}</strong> ({t.phone1 || 'N/A'})</p>
                                                            <p>👤 খেলোয়াড় ২: <strong className="text-white">{t.player2}</strong> ({t.phone2 || 'N/A'})</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {homeSubView === 'all_players' && (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-700 text-yellow-400 border-b border-slate-600">
                                                            <th className="p-2.5">খেলোয়াড়ের নাম</th>
                                                            <th className="p-2.5">টিমের নাম</th>
                                                            <th className="p-2.5">গ্রুপ</th>
                                                            <th className="p-2.5">ক্যাটাগরি</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700 text-gray-200">
                                                        {getAllPlayers().map((p, i) => (
                                                            <tr key={i} className="hover:bg-slate-700/50">
                                                                <td className="p-2.5 font-bold text-white">{p.name}</td>
                                                                <td className="p-2.5">{p.teamName}</td>
                                                                <td className="p-2.5 text-yellow-400">{p.groupName}</td>
                                                                <td className="p-2.5">{getCategoryBadge(p.category)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'groups' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-yellow-400 text-center mb-2">🏆 গ্রুপ পর্বের টিম ও খেলোয়াড়বৃন্দ (HIGH, MEDIUM, LOW ক্যাটাগরি) 🏆</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.keys(groupsData).map((groupName) => (
                                        <div key={groupName} className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
                                            <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2 mb-4 flex justify-between items-center">
                                                <span>{groupName}</span>
                                                <span className="text-xs bg-slate-700 px-2.5 py-1 rounded text-gray-300 font-normal">টিম সংখ্যা: {groupsData[groupName].length}</span>
                                            </h3>
                                            <div className="space-y-4">
                                                {groupsData[groupName].map((t, idx) => (
                                                    <div key={idx} className="bg-slate-700/70 p-3.5 rounded-lg border border-slate-600">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <h4 className="font-bold text-white text-base">{t.teamName}</h4>
                                                            {getCategoryBadge(t.category)}
                                                        </div>
                                                        <div className="text-xs text-gray-300 space-y-1">
                                                            <p><span className="text-gray-400">খেলোয়াড় ১:</span> <strong className="text-gray-100">{t.player1}</strong></p>
                                                            <p><span className="text-gray-400">খেলোয়াড় ২:</span> <strong className="text-gray-100">{t.player2}</strong></p>
                                                            <p><span className="text-gray-400">ঠিকানা:</span> {t.address || 'N/A'}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'matches' && (
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                <h2 className="text-xl font-bold text-yellow-400 mb-4">পূর্ণাঙ্গ ম্যাচ ফিক্সচার ও শিডিউল</h2>
                                <div className="space-y-4">
                                    {matches.map(m => (
                                        <div key={m.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                            <div>
                                                <span className="text-xs bg-slate-800 text-yellow-400 px-2 py-0.5 rounded border border-slate-600 mb-1 inline-block">{m.stage}</span>
                                                <h3 className="text-lg font-bold text-white">{m.match}</h3>
                                                <p className="text-xs text-gray-300 mt-1">⏰ সময় ও তারিখ: {m.time}</p>
                                            </div>
                                            <span className="bg-yellow-500 text-gray-900 font-bold px-4 py-1.5 rounded-lg text-sm self-start md:self-center">{m.score}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && !isAdmin && (
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto shadow-lg">
                                <h2 className="text-xl font-bold text-yellow-400 mb-4 text-center">এডমিন লগইন</h2>
                                {loginError && <p className="bg-red-500/20 text-red-400 p-2 rounded mb-3 text-sm text-center border border-red-500/30">{loginError}</p>}
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-300 mb-1">ইমেইল ঠিকানা</label>
                                        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="efshikhelaghor@gmail.com" required className="w-full bg-slate-700 border border-slate-600 rounded p-2.5 text-white text-sm focus:outline-none focus:border-yellow-500" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-300 mb-1">পাসওয়ার্ড</label>
                                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="পাসওয়ার্ড দিন" required className="w-full bg-slate-700 border border-slate-600 rounded p-2.5 text-white text-sm focus:outline-none focus:border-yellow-500" />
                                    </div>
                                    <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 rounded transition">লগইন করুন</button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'dashboard' && isAdmin && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                    <h2 className="text-xl font-bold text-yellow-400 mb-2">⚙️ এডমিন কন্ট্রোল প্যানেল</h2>
                                    <p className="text-sm text-gray-300">লগইনকৃত এডমিন: <span className="text-green-400 font-semibold">efshikhelaghor@gmail.com</span> (শুধুমাত্র আপনি ক্যাটাগরি ও তথ্য যোগ বা মুছতে পারবেন)</p>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">গ্রুপে টিম, ২জন খেলোয়াড় ও ক্যাটাগরি (HIGH/MEDIUM/LOW) যোগ করুন</h3>
                                    <form onSubmit={addTeamToGroup} className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">গ্রুপ সিলেক্ট করুন</label>
                                            <select value={teamForm.group} onChange={e => setTeamForm({ ...teamForm, group: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none">
                                                <option value="গ্রুপ এ">গ্রুপ এ</option>
                                                <option value="গ্রুপ বি">গ্রুপ বি</option>
                                                <option value="গ্রুপ সি">গ্রুপ সি</option>
                                                <option value="গ্রুপ ডি">গ্রুপ ডি</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">টিমের নাম *</label>
                                            <input type="text" placeholder="টিমের নাম" value={teamForm.teamName} onChange={e => setTeamForm({ ...teamForm, teamName: e.target.value })} required className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">খেলোয়াড় ১ এর নাম *</label>
                                            <input type="text" placeholder="প্লেয়ার ১" value={teamForm.player1} onChange={e => setTeamForm({ ...teamForm, player1: e.target.value })} required className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">খেলোয়াড় ১ মোবাইল</label>
                                            <input type="text" placeholder="মোবাইল ১" value={teamForm.phone1} onChange={e => setTeamForm({ ...teamForm, phone1: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">খেলোয়াড় ২ এর নাম *</label>
                                            <input type="text" placeholder="প্লেয়ার ২" value={teamForm.player2} onChange={e => setTeamForm({ ...teamForm, player2: e.target.value })} required className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">খেলোয়াড় ২ মোবাইল</label>
                                            <input type="text" placeholder="মোবাইল ২" value={teamForm.phone2} onChange={e => setTeamForm({ ...teamForm, phone2: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">ক্যাটাগরি সিলেক্ট করুন *</label>
                                            <select value={teamForm.category} onChange={e => setTeamForm({ ...teamForm, category: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none font-bold text-yellow-400">
                                                <option value="HIGH">HIGH</option>
                                                <option value="MEDIUM">MEDIUM</option>
                                                <option value="LOW">LOW</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">ঠিকানা</label>
                                            <input type="text" placeholder="ঠিকানা" value={teamForm.address} onChange={e => setTeamForm({ ...teamForm, address: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded text-sm md:col-span-2 transition">টিম ও খেলোয়াড় যোগ করুন</button>
                                    </form>

                                    <div className="mt-6 space-y-4">
                                        <h4 className="text-sm font-semibold text-gray-300">বর্তমান গ্রুপ ও টিম ম্যানেজমেন্ট (তথ্য মুছুন বা পরিবর্তন করুন):</h4>
                                        {Object.keys(groupsData).map(gName => (
                                            <div key={gName} className="bg-slate-700/50 p-3 rounded-lg border border-slate-600">
                                                <h5 className="font-bold text-yellow-400 mb-2">{gName}</h5>
                                                <div className="space-y-2">
                                                    {groupsData[gName].map((t, idx) => (
                                                        <div key={idx} className="bg-slate-800 p-3 rounded flex justify-between items-center text-xs">
                                                            <div>
                                                                <span className="font-bold text-white text-sm">{t.teamName}</span> {getCategoryBadge(t.category)}
                                                                <p className="text-gray-300 mt-1">👤 {t.player1} & 👤 {t.player2}</p>
                                                            </div>
                                                            <button onClick={() => deleteTeamFromGroup(gName, idx)} className="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded transition">ডিলিট</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">নোটিশ / ঘোষণা আপডেট</h3>
                                    <form onSubmit={addNotice} className="flex gap-2">
                                        <input type="text" placeholder="নতুন নোটিশ লিখুন..." value={newNotice} onChange={e => setNewNotice(e.target.value)} required className="flex-grow bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-4 py-2 rounded text-sm transition">পাবলিশ</button>
                                    </form>
                                    <div className="space-y-2">
                                        {notices.map(n => (
                                            <div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-center text-sm">
                                                <span>{n.text}</span>
                                                <button onClick={() => deleteNotice(n.id)} className="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded transition ml-2">ডিলিট</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">ম্যাচ ফিক্সচার ও শিডিউল সেট</h3>
                                    <form onSubmit={addMatch} className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <input type="text" placeholder="ম্যাচ (যেমন: টিম আলফা বনাম টিম বিটা)" value={matchForm.match} onChange={e => setMatchForm({ ...matchForm, match: e.target.value })} required className="bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <input type="text" placeholder="ধাপ/রাউন্ড (যেমন: গ্রুপ পর্ব/সেমিফাইনাল)" value={matchForm.stage} onChange={e => setMatchForm({ ...matchForm, stage: e.target.value })} className="bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <input type="text" placeholder="সময় ও তারিখ" value={matchForm.time} onChange={e => setMatchForm({ ...matchForm, time: e.target.value })} className="bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <input type="text" placeholder="স্কোর / স্ট্যাটাস (যেমন: ২-১)" value={matchForm.score} onChange={e => setMatchForm({ ...matchForm, score: e.target.value })} className="bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded text-sm md:col-span-2 transition">ফিক্সচার যোগ করুন</button>
                                    </form>
                                    <div className="space-y-2">
                                        {matches.map(m => (
                                            <div key={m.id} className="bg-slate-700 p-3 rounded flex justify-between items-center text-sm">
                                                <div>
                                                    <span className="font-bold text-white">{m.match}</span> ({m.stage}) - <span className="text-yellow-400">{m.score}</span>
                                                </div>
                                                <button onClick={() => deleteMatch(m.id)} className="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded transition">ডিলিট</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-800 text-center p-4 text-xs text-gray-400 border-t border-slate-700">
                        © 2026 Winter Carram Kings Battle. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
