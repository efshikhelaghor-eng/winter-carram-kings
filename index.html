            const [notices, setNotices] = React.useState([

            // Matches & Fixtures
            const [matches, setMatches] = React.useState([
                { id: 1, match: 'টিম আলফা বনাম টিম বিটা', stage: 'গ্রুপ পর্ব', time: '২০২৬-০৩-১৫, বিকেল ৪:০০ টা', score: '২-১ (সমাপ্ত)', status: 'recent' },

            const [matchForm, setMatchForm] = React.useState({
                match: '', stage: 'গ্রুপ পর্ব', time: '', score: 'আসন্ন', status: 'upcoming'

                { team: 'টিম রয়্যাল', group: 'গ্রুপ বি', played: 1, won: 0, lost: 0, pts: 1 },
                { team: 'টিম থান্ডার', group: 'গ্রুপ সি', played: 0, won: 0, lost: 0, pts: 0 }
            ]);

            const [standingForm, setStandingForm] = React.useState({
                team: '', group: 'গ্রুপ এ', played: 0, won: 0, lost: 0, pts: 0
            });

            const [teamForm, setTeamForm] = React.useState({
                group: 'গ্রুপ এ', teamName: '', address: '',
                player1: '', cat1: 'HIGH', phone1: '',
                player2: '', cat2: 'MEDIUM', phone2: ''
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (email === 'efshikhelaghor@gmail.com' && password === 'admin123') {
                    setIsAdmin(true);
                    setLoginError('');
                    setActiveTab('dashboard');
                } else {
                    setLoginError('ভুল ইমেইল বা পাসওয়ার্ড!');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                setEmail('');
                setPassword('');
                setActiveTab('home');
                setHomeSubView(null);
            };

            const addTeamToGroup = (e) => {
                e.preventDefault();
                if (teamForm.teamName && teamForm.player1 && teamForm.player2) {
                    const group = teamForm.group;
                    const updatedGroup = [...(groupsData[group] || []), teamForm];
                    setGroupsData({ ...groupsData, [group]: updatedGroup });
                    setTeamForm({
                        group: 'গ্রুপ এ', teamName: '', address: '',
                        player1: '', cat1: 'HIGH', phone1: '',
                        player2: '', cat2: 'MEDIUM', phone2: ''
                    });
                }
            };

            const deleteTeamFromGroup = (group, index) => {
                const updatedGroup = groupsData[group].filter((_, i) => i !== index);
                setGroupsData({ ...groupsData, [group]: updatedGroup });
            };

            const addNotice = (e) => {
                e.preventDefault();
                if (newNotice.trim()) {
                    setNotices([{ id: Date.now(), text: newNotice, date: new Date().toISOString().split('T')[0] }, ...notices]);
                    setNewNotice('');
                }
            };

            const deleteNotice = (id) => {
                setNotices(notices.filter(n => n.id !== id));
            };

            const addMatch = (e) => {
                e.preventDefault();
                if (matchForm.match) {
                    setMatches([...matches, { ...matchForm, id: Date.now() }]);
                    setMatchForm({ match: '', stage: 'গ্রুপ পর্ব', time: '', score: 'আসন্ন', status: 'upcoming' });
                }
            };

            const deleteMatch = (id) => {
                setMatches(matches.filter(m => m.id !== id));
            };

            const addStanding = (e) => {
                e.preventDefault();
                if (standingForm.team) {
                    setStandings([...standings, { ...standingForm }]);
                    setStandingForm({ team: '', group: 'গ্রুপ এ', played: 0, won: 0, lost: 0, pts: 0 });
                }
            };

            const deleteStanding = (index) => {
                setStandings(standings.filter((_, i) => i !== index));
            };

            const getAllTeams = () => {
                let list = [];
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        list.push({ ...t, groupName: g });
                    });
                });
                return list;
            };

            const getAllPlayers = () => {
                let list = [];
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        list.push({ name: t.player1, phone: t.phone1, category: t.cat1, teamName: t.teamName, groupName: g });
                        list.push({ name: t.player2, phone: t.phone2, category: t.cat2, teamName: t.teamName, groupName: g });
                    });
                });
                return list;
            };

            const getCategoryBadge = (cat) => {
                let color = "bg-gray-700 text-gray-200 border-gray-600";
                if (cat === 'HIGH') color = "bg-red-500/20 text-red-400 border-red-500/30";
                else if (cat === 'MEDIUM') color = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30";
                else if (cat === 'LOW') color = "bg-green-500/20 text-green-400 border-green-500/30";
                return <span className={`px-2 py-0.5 rounded text-xs border font-semibold ml-1.5 ${color}`}>{cat}</span>;
            };

                                        </div>

                                        {homeSubView === 'all_groups' && (

                                                        <p className="text-xs text-gray-300 mt-1">{groupsData[g].length}টি টিম অন্তর্ভুক্ত</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {homeSubView === 'all_teams' && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {getAllTeams().map((t, i) => (
                                                    <div key={i} className="bg-slate-700 p-4 rounded-xl border border-slate-600 space-y-2">
                                                        <div className="border-b border-slate-600 pb-1.5">
                                                            <h4 className="font-bold text-white text-base">{t.teamName}</h4>
                                                            <p className="text-xs text-yellow-300">গ্রুপ: {t.groupName}</p>
                                                        </div>
                                                        <div className="text-xs text-gray-300 space-y-1.5">
                                                            <p className="flex items-center">
                                                                <span>👤 খেলোয়াড় ১: <strong className="text-white">{t.player1}</strong></span>
                                                                {getCategoryBadge(t.cat1)}
                                                            </p>
                                                            <p className="flex items-center">
                                                                <span>👤 খেলোয়াড় ২: <strong className="text-white">{t.player2}</strong></span>
                                                                {getCategoryBadge(t.cat2)}
                                                            </p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {homeSubView === 'all_players' && (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-700 text-yellow-400 border-b border-slate-600">
                                                            <th className="p-2.5">খেলোয়াড়ের নাম</th>
                                                            <th className="p-2.5">ক্যাটাগরি</th>
                                                            <th className="p-2.5">টিমের নাম</th>
                                                            <th className="p-2.5">গ্রুপ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700 text-gray-200">
                                                        {getAllPlayers().map((p, i) => (
                                                            <tr key={i} className="hover:bg-slate-700/50">
                                                                <td className="p-2.5 font-bold text-white">{p.name}</td>
                                                                <td className="p-2.5">{getCategoryBadge(p.category)}</td>
                                                                <td className="p-2.5">{p.teamName}</td>
                                                                <td className="p-2.5 text-yellow-400">{p.groupName}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'groups' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-bold text-yellow-400 text-center mb-2">🏆 গ্রুপ পর্বের টিম ও খেলোয়াড়বৃন্দ 🏆</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {Object.keys(groupsData).map((groupName) => (
                                        <div key={groupName} className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
                                            <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2 mb-4 flex justify-between items-center">
                                                <span>{groupName}</span>
                                                <span className="text-xs bg-slate-700 px-2.5 py-1 rounded text-gray-300 font-normal">টিম সংখ্যা: {groupsData[groupName].length}</span>
                                            </h3>
                                            <div className="space-y-4">
                                                {groupsData[groupName].map((t, idx) => (
                                                    <div key={idx} className="bg-slate-700/70 p-3.5 rounded-lg border border-slate-600">
                                                        <h4 className="font-bold text-white text-base border-b border-slate-600 pb-1 mb-2">{t.teamName}</h4>
                                                        <div className="text-xs text-gray-300 space-y-1.5">
                                                            <p className="flex items-center">
                                                                <span><strong className="text-gray-400">খেলোয়াড় ১:</strong> <strong className="text-gray-100">{t.player1}</strong></span>
                                                                {getCategoryBadge(t.cat1)}
                                                            </p>
                                                            <p className="flex items-center">
                                                                <span><strong className="text-gray-400">খেলোয়াড় ২:</strong> <strong className="text-gray-100">{t.player2}</strong></span>
                                                                {getCategoryBadge(t.cat2)}
                                                            </p>
                                                            <p><span className="text-gray-400">ঠিকানা:</span> {t.address || 'N/A'}</p>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                            <div className="space-y-8">

                                        {matches.map(m => (
                                            <div key={m.id} className="bg-slate-700 p-4 rounded-xl border border-slate-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">

                                                        <span className="text-xs bg-slate-800 text-yellow-400 px-2 py-0.5 rounded border border-slate-600">{m.stage}</span>
                                                        {m.status === 'live' && <span className="bg-red-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold animate-pulse">LIVE</span>}
                                                        {m.status === 'recent' && <span className="bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">সম্পন্ন</span>}
                                                        {m.status === 'upcoming' && <span className="bg-green-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">আসন্ন</span>}
                                                    </div>
                                                    <h3 className="text-lg font-bold text-white">{m.match}</h3>
                                                    <p className="text-xs text-gray-300 mt-1">⏰ সময় ও তারিখ: {m.time}</p>

                                                <span className="bg-yellow-500 text-gray-900 font-bold px-4 py-1.5 rounded-lg text-sm self-start md:self-center">{m.score}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Points Table */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h2 className="text-xl font-bold text-yellow-400">📊 টুর্নামেন্ট পয়েন্ট টেবিল</h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm border-collapse">
                                            <thead>
                                                <tr className="bg-slate-700 text-yellow-400 border-b border-slate-600">
                                                    <th className="p-3">টিমের নাম</th>
                                                    <th className="p-3">গ্রুপ</th>
                                                    <th className="p-3 text-center">ম্যাচ খেলা</th>
                                                    <th className="p-3 text-center">জয়</th>
                                                    <th className="p-3 text-center">হার</th>
                                                    <th className="p-3 text-center">পয়েন্ট</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700 text-gray-200">
                                                {standings.map((s, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-700/50">
                                                        <td className="p-3 font-bold text-white">{s.team}</td>
                                                        <td className="p-3 text-yellow-400">{s.group}</td>
                                                        <td className="p-3 text-center">{s.played}</td>
                                                        <td className="p-3 text-center text-green-400">{s.won}</td>
                                                        <td className="p-3 text-center text-red-400">{s.lost}</td>
                                                        <td className="p-3 text-center font-extrabold text-yellow-400">{s.pts}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'admin' && !isAdmin && (
                            <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md mx-auto shadow-lg">
                                <h2 className="text-xl font-bold text-yellow-400 mb-4 text-center">এডমিন লগইন</h2>
                                {loginError && <p className="bg-red-500/20 text-red-400 p-2 rounded mb-3 text-sm text-center border border-red-500/30">{loginError}</p>}
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-300 mb-1">ইমেইল ঠিকানা</label>
                                        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="efshikhelaghor@gmail.com" required className="w-full bg-slate-700 border border-slate-600 rounded p-2.5 text-white text-sm focus:outline-none focus:border-yellow-500" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-300 mb-1">পাসওয়ার্ড</label>
                                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="পাসওয়ার্ড দিন" required className="w-full bg-slate-700 border border-slate-600 rounded p-2.5 text-white text-sm focus:outline-none focus:border-yellow-500" />
                                    </div>
                                    <button type="submit" className="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 rounded transition">লগইন করুন</button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'dashboard' && isAdmin && (
                            <div className="space-y-6">
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                                    <h2 className="text-xl font-bold text-yellow-400 mb-2">⚙️ এডমিন কন্ট্রোল প্যানেল</h2>
                                    <p className="text-sm text-gray-300">লগইনকৃত এডমিন: <span className="text-green-400 font-semibold">efshikhelaghor@gmail.com</span> (শুধুমাত্র আপনি ম্যাচ রেজাল্ট, লাইভ স্কোর, আপকামিং শিডিউল এবং পয়েন্ট টেবিল আপডেট বা মুছতে পারবেন)</p>
                                </div>

                                {/* Manage Teams & Players */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">গ্রুপে টিম ও খেলোয়াড় যোগ করুন</h3>
                                    <form onSubmit={addTeamToGroup} className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">গ্রুপ সিলেক্ট করুন</label>
                                            <select value={teamForm.group} onChange={e => setTeamForm({ ...teamForm, group: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none">
                                                <option value="গ্রুপ এ">গ্রুপ এ</option>
                                                <option value="গ্রুপ বি">গ্রুপ বি</option>
                                                <option value="গ্রুপ সি">গ্রুপ সি</option>
                                                <option value="গ্রুপ ডি">গ্রুপ ডি</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">টিমের নাম *</label>
                                            <input type="text" placeholder="টিমের নাম" value={teamForm.teamName} onChange={e => setTeamForm({ ...teamForm, teamName: e.target.value })} required className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        
                                        <div className="bg-slate-700/50 p-3 rounded border border-slate-600 space-y-2">
                                            <span className="text-xs font-bold text-yellow-400">খেলোয়াড় ১ এর তথ্য</span>
                                            <input type="text" placeholder="খেলোয়াড় ১ এর নাম *" value={teamForm.player1} onChange={e => setTeamForm({ ...teamForm, player1: e.target.value })} required className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                            <div className="flex gap-2">
                                                <select value={teamForm.cat1} onChange={e => setTeamForm({ ...teamForm, cat1: e.target.value })} className="w-1/2 bg-slate-800 border border-slate-600 rounded p-2 text-xs text-yellow-400 font-bold focus:outline-none">
                                                    <option value="HIGH">HIGH</option>
                                                    <option value="MEDIUM">MEDIUM</option>
                                                    <option value="LOW">LOW</option>
                                                </select>
                                                <input type="text" placeholder="মোবাইল ১" value={teamForm.phone1} onChange={e => setTeamForm({ ...teamForm, phone1: e.target.value })} className="w-1/2 bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white focus:outline-none" />
                                            </div>
                                        </div>

                                        <div className="bg-slate-700/50 p-3 rounded border border-slate-600 space-y-2">
                                            <span className="text-xs font-bold text-yellow-400">খেলোয়াড় ২ এর তথ্য</span>
                                            <input type="text" placeholder="খেলোয়াড় ২ এর নাম *" value={teamForm.player2} onChange={e => setTeamForm({ ...teamForm, player2: e.target.value })} required className="w-full bg-slate-800 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                            <div className="flex gap-2">
                                                <select value={teamForm.cat2} onChange={e => setTeamForm({ ...teamForm, cat2: e.target.value })} className="w-1/2 bg-slate-800 border border-slate-600 rounded p-2 text-xs text-yellow-400 font-bold focus:outline-none">
                                                    <option value="HIGH">HIGH</option>
                                                    <option value="MEDIUM">MEDIUM</option>
                                                    <option value="LOW">LOW</option>
                                                </select>
                                                <input type="text" placeholder="মোবাইল ২" value={teamForm.phone2} onChange={e => setTeamForm({ ...teamForm, phone2: e.target.value })} className="w-1/2 bg-slate-800 border border-slate-600 rounded p-2 text-xs text-white focus:outline-none" />
                                            </div>
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-xs text-gray-300 mb-1">ঠিকানা</label>
                                            <input type="text" placeholder="ঠিকানা" value={teamForm.address} onChange={e => setTeamForm({ ...teamForm, address: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>

                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded text-sm md:col-span-2 transition">টিম ও খেলোয়াড় যোগ করুন</button>
                                    </form>

                                        {Object.keys(groupsData).map(gName => (
                                            <div key={gName} className="bg-slate-700/50 p-3 rounded-lg border border-slate-600">
                                                <h5 className="font-bold text-yellow-400 mb-2">{gName}</h5>
                                                <div className="space-y-2">
                                                    {groupsData[gName].map((t, idx) => (
                                                        <div key={idx} className="bg-slate-800 p-3 rounded flex justify-between items-center text-xs">
                                                            <div>
                                                                <span className="font-bold text-white text-sm">{t.teamName}</span>
                                                                <p className="text-gray-300 mt-1">
                                                                    👤 {t.player1} {getCategoryBadge(t.cat1)} &nbsp;|&nbsp; 👤 {t.player2} {getCategoryBadge(t.cat2)}
                                                                </p>
                                                            </div>
                                                            <button onClick={() => deleteTeamFromGroup(gName, idx)} className="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded transition">ডিলিট</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Manage Matches & Live Scores */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">

                                    <form onSubmit={addMatch} className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">ম্যাচ (যেমন: টিম আলফা বনাম টিম বিটা)</label>
                                            <input type="text" placeholder="ম্যাচের বিবরণ" value={matchForm.match} onChange={e => setMatchForm({ ...matchForm, match: e.target.value })} required className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">ধাপ/রাউন্ড</label>
                                            <input type="text" placeholder="গ্রুপ পর্ব / সেমিফাইনাল" value={matchForm.stage} onChange={e => setMatchForm({ ...matchForm, stage: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">সময় ও তারিখ</label>
                                            <input type="text" placeholder="তারিখ ও সময়" value={matchForm.time} onChange={e => setMatchForm({ ...matchForm, time: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">স্কোর বা রেজাল্ট</label>
                                            <input type="text" placeholder="যেমন: ২-১ (সমাপ্ত) বা লাইভ: ১-০" value={matchForm.score} onChange={e => setMatchForm({ ...matchForm, score: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-300 mb-1">স্ট্যাটাস</label>
                                            <select value={matchForm.status} onChange={e => setMatchForm({ ...matchForm, status: e.target.value })} className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none">
                                                <option value="upcoming">আসন্ন (Upcoming)</option>
                                                <option value="live">লাইভ (Live)</option>
                                                <option value="recent">সম্পন্ন/রেজাল্ট (Recent)</option>
                                            </select>
                                        </div>
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded text-sm md:col-span-2 transition">ম্যাচ ফিক্সচার বা রেজাল্ট যোগ করুন</button>
                                    </form>

                                    <div className="space-y-2 mt-4">
                                        <h4 className="text-sm font-semibold text-gray-300">বর্তমান ম্যাচ তালিকা (মুছতে পারবেন):</h4>
                                        {matches.map(m => (
                                            <div key={m.id} className="bg-slate-700 p-3 rounded flex justify-between items-center text-sm">
                                                <div>
                                                    <span className="font-bold text-white">{m.match}</span> ({m.stage}) - <span className="text-yellow-400">{m.score}</span> [{m.status}]
                                                </div>
                                                <button onClick={() => deleteMatch(m.id)} className="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded transition">ডিলিট</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Manage Points Table */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">পয়েন্ট টেবিল সেট ও আপডেট</h3>
                                    <form onSubmit={addStanding} className="grid grid-cols-2 md:grid-cols-6 gap-2">
                                        <input type="text" placeholder="টিমের নাম" value={standingForm.team} onChange={e => setStandingForm({ ...standingForm, team: e.target.value })} required className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <input type="text" placeholder="গ্রুপ" value={standingForm.group} onChange={e => setStandingForm({ ...standingForm, group: e.target.value })} className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <input type="number" placeholder="খেলা" value={standingForm.played} onChange={e => setStandingForm({ ...standingForm, played: parseInt(e.target.value) || 0 })} className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <input type="number" placeholder="জয়" value={standingForm.won} onChange={e => setStandingForm({ ...standingForm, won: parseInt(e.target.value) || 0 })} className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <input type="number" placeholder="হার" value={standingForm.lost} onChange={e => setStandingForm({ ...standingForm, lost: parseInt(e.target.value) || 0 })} className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <input type="number" placeholder="পয়েন্ট" value={standingForm.pts} onChange={e => setStandingForm({ ...standingForm, pts: parseInt(e.target.value) || 0 })} className="bg-slate-700 border border-slate-600 rounded p-2 text-xs text-white" />
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded text-xs col-span-2 md:col-span-6 transition">পয়েন্ট টেবিলে টিম যোগ করুন</button>
                                    </form>

                                    <div className="space-y-2 mt-4">
                                        <h4 className="text-sm font-semibold text-gray-300">পয়েন্ট টেবিল লিস্ট (মুছতে পারবেন):</h4>
                                        {standings.map((s, idx) => (
                                            <div key={idx} className="bg-slate-700 p-3 rounded flex justify-between items-center text-xs">
                                                <span><strong>{s.team}</strong> ({s.group}) - খেলা: {s.played}, জয়: {s.won}, হার: {s.lost}, পয়েন্ট: <strong>{s.pts}</strong></span>
                                                <button onClick={() => deleteStanding(idx)} className="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded transition">ডিলিট</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* Manage Notices */}
                                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
                                    <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">নোটিশ / ঘোষণা আপডেট</h3>
                                    <form onSubmit={addNotice} className="flex gap-2">
                                        <input type="text" placeholder="নতুন নোটিশ লিখুন..." value={newNotice} onChange={e => setNewNotice(e.target.value)} required className="flex-grow bg-slate-700 border border-slate-600 rounded p-2 text-sm text-white focus:outline-none focus:border-yellow-500" />
                                        <button type="submit" className="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold px-4 py-2 rounded text-sm transition">পাবলিশ</button>
                                    </form>
                                    <div className="space-y-2">
                                        {notices.map(n => (
                                            <div key={n.id} className="bg-slate-700 p-3 rounded flex justify-between items-center text-sm">
                                                <span>{n.text}</span>
                                                <button onClick={() => deleteNotice(n.id)} className="bg-red-500 hover:bg-red-600 text-white text-xs px-2.5 py-1 rounded transition ml-2">ডিলিট</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="bg-slate-800 text-center p-4 text-xs text-gray-400 border-t border-slate-700">
                        © 2026 Winter Carram Kings Battle. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
