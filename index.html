<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-javascript@2"></script>
</head>
<body class="bg-gradient-to-br from-gray-950 via-slate-900 to-gray-900 text-white font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // -------------------------------------------------------------
        // Supabase Credentials (Configured)
        // -------------------------------------------------------------
        const SUPABASE_URL = "https://ksxzlwiyqullkpndffty.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bJn8W57PKdo0owl6fV8wgQ_fhKM3XvZ";
        
        // Supabase Client Initialisation
        const supabase = (SUPABASE_URL && window.supabase) 
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
            : null;

        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [loading, setLoading] = React.useState(true);
            
            // Admin Credentials
            const [adminEmail, setAdminEmail] = React.useState('efshikhelaghor@gmail.com');
            const [adminPassword, setAdminPassword] = React.useState('admin123');

            const [emailInput, setEmailInput] = React.useState('');
            const [passInput, setPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            const [selectedGroupModal, setSelectedGroupModal] = React.useState(null);

            const defaultGroups = {
                'গ্রুপ এ': [],
                'গ্রুপ বি': [],
                'গ্রুপ সি': [],
                'গ্রুপ ডি': []
            };

            const [groupsData, setGroupsData] = React.useState(defaultGroups);
            const [notices, setNotices] = React.useState([]);
            const [tournamentMatches, setTournamentMatches] = React.useState({});
            const [standings, setStandings] = React.useState([]);

            // -------------------------------------------------------------
            // Supabase Database থেকে লেটেস্ট Data Fetch করার Function
            // -------------------------------------------------------------
            const fetchDataFromSupabase = async () => {
                if (!supabase) {
                    setLoading(false);
                    return;
                }
                setLoading(true);
                try {
                    // Fetch Teams
                    const { data: teamsData } = await supabase.from('teams').select('*');
                    if (teamsData) {
                        const formatted = { 'গ্রুপ এ': [], 'গ্রুপ বি': [], 'গ্রুপ সি': [], 'গ্রুপ ডি': [] };
                        teamsData.forEach(item => {
                            if (formatted[item.group_name]) {
                                formatted[item.group_name].push(item.data);
                            }
                        });
                        setGroupsData(formatted);
                    }

                    // Fetch Matches
                    const { data: matchesData } = await supabase.from('matches').select('*');
                    if (matchesData) {
                        const formattedMatches = {};
                        matchesData.forEach(item => {
                            if (!formattedMatches[item.stage]) formattedMatches[item.stage] = [];
                            formattedMatches[item.stage].push(item.data);
                        });
                        setTournamentMatches(formattedMatches);
                    }

                    // Fetch Notices
                    const { data: noticesData } = await supabase.from('notices').select('*').order('created_at', { ascending: false });
                    if (noticesData) {
                        setNotices(noticesData.map(n => ({ id: n.id, text: n.text, date: n.date })));
                    }

                    // Fetch Standings
                    const { data: standingsData } = await supabase.from('standings').select('*');
                    if (standingsData) {
                        setStandings(standingsData.map(s => s.data));
                    }
                } catch (err) {
                    console.error("Error fetching data from Supabase:", err);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                fetchDataFromSupabase();
            }, []);

            const [singlePlayerForm, setSinglePlayerForm] = React.useState({
                name: '', address: '', phone: '', category: 'HIGH', group: 'গ্রুপ এ', teamName: ''
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (emailInput.trim() === adminEmail && passInput === adminPassword) {
                    setIsAdmin(true);
                    setLoginError('');
                    setActiveTab('dashboard');
                } else {
                    setLoginError('ভুল ইমেইল বা পাসওয়ার্ড!');
                }
            };

            const handleLogout = () => {
                setIsAdmin(false);
                setEmailInput('');
                setPassInput('');
                setActiveTab('home');
            };

            // Player Save & Supabase Sync (Fixed with .insert)
            const saveSinglePlayer = async (e) => {
                e.preventDefault();
                if (singlePlayerForm.name && singlePlayerForm.group) {
                    const group = singlePlayerForm.group;
                    const groupTeams = [...(groupsData[group] || [])];
                    
                    const newTeamObj = {
                        id: Date.now(), 
                        serial: String(groupTeams.length + 1).padStart(2, '0'), 
                        teamName: singlePlayerForm.teamName || 'টিম ' + (groupTeams.length + 1), 
                        address: singlePlayerForm.address,
                        player1: singlePlayerForm.name, 
                        cat1: singlePlayerForm.category, 
                        phone1: singlePlayerForm.phone,
                        player2: 'অপেক্ষমাণ', 
                        cat2: 'MEDIUM', 
                        phone2: ''
                    };
                    
                    // Supabase এ ডাটা সরাসরি Insert করার কোড
                    if (supabase) {
                        const { error } = await supabase.from('teams').insert([
                            { group_name: group, data: newTeamObj }
                        ]);
                        if (error) {
                            console.error("Supabase Insert Error:", error);
                            alert("ডেটা সেভ করতে সমস্যা হয়েছে: " + error.message);
                            return;
                        }
                    }

                    groupTeams.push(newTeamObj);
                    setGroupsData({ ...groupsData, [group]: groupTeams });
                    setSinglePlayerForm({ name: '', address: '', phone: '', category: 'HIGH', group: 'গ্রুপ এ', teamName: '' });
                    alert('সফলভাবে Supabase-এ ডেটা সেভ হয়েছে!');
                }
            };

            const getAllRegisteredPlayers = () => {
                let list = [];
                let globalSerial = 1;
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        if (t.player1) {
                            list.push({ 
                                serial: String(globalSerial++).padStart(2, '0'),
                                name: t.player1, phone: t.phone1, category: t.cat1, teamName: t.teamName, address: t.address, groupName: g 
                            });
                        }
                    });
                });
                return list;
            };

            const getCategoryBadge = (cat) => {
                let color = "bg-gray-700 text-gray-200 border-gray-600";
                if (cat === 'HIGH') color = "bg-red-500/20 text-red-400 border-red-500/30";
                else if (cat === 'MEDIUM') color = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30";
                else if (cat === 'LOW') color = "bg-green-500/20 text-green-400 border-green-500/30";
                return <span className={`px-2 py-0.5 rounded text-xs border font-semibold ml-1.5 inline-block ${color}`}>{cat}</span>;
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 text-gray-100 font-sans">
                    {/* Header */}
                    <header className="bg-slate-900/90 backdrop-blur-md shadow-lg p-4 border-b border-yellow-500/40 flex justify-between items-center px-4 md:px-8 sticky top-0 z-50">
                        <div className="flex items-center space-x-3">
                            <span className="text-2xl md:text-3xl">👑</span>
                            <div>
                                <h1 className="text-lg md:text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500">উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং</h1>
                                <p className="text-[11px] md:text-xs text-gray-400 tracking-wide">
                                    Supabase ডাটাবেজ কানেক্টেড {isAdmin && <span className="bg-red-600/90 text-white px-2 py-0.5 rounded-full text-[10px] ml-2 font-bold border border-red-400">এডমিন মোড</span>}
                                </p>
                            </div>
                        </div>
                        <div>
                            {isAdmin ? (
                                <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition flex items-center gap-1.5">
                                    🔒 লগআউট
                                </button>
                            ) : (
                                <button onClick={() => setActiveTab('admin')} className="bg-yellow-500 hover:bg-yellow-400 text-gray-950 px-4 py-2 rounded-xl text-sm font-extrabold shadow-md transition flex items-center gap-1.5">
                                    🔑 এডমিন লগইন
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Navigation Bar */}
                    <nav className="flex justify-center bg-slate-800/80 backdrop-blur p-2.5 gap-2 md:gap-4 flex-wrap border-b border-slate-700">
                        <button onClick={() => { setActiveTab('home'); setSelectedGroupModal(null); }} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'home' ? 'bg-yellow-500 text-gray-950' : 'bg-slate-700/80 text-gray-200'}`}>হোম ও নোটিশ</button>
                        <button onClick={() => setActiveTab('groups')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'groups' ? 'bg-yellow-500 text-gray-950' : 'bg-slate-700/80 text-gray-200'}`}>গ্রুপ ও খেলোয়াড়বৃন্দ</button>
                        <button onClick={() => setActiveTab('matches')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'matches' ? 'bg-yellow-500 text-gray-950' : 'bg-slate-700/80 text-gray-200'}`}>টুর্নামেন্ট ফিক্সচার</button>
                        {isAdmin && <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-xl font-bold text-sm ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'bg-red-900/80 text-red-200'}`}>⚙️ এডমিন প্যানেল</button>}
                    </nav>

                    <main className="flex-grow p-4 md:p-6 max-w-6xl mx-auto w-full space-y-6">

                        {loading ? (
                            <div className="text-center py-20 text-yellow-400 font-bold animate-pulse text-lg">
                                🔄 Supabase থেকে ডাটা লোড হচ্ছে...
                            </div>
                        ) : (
                            <>
                                {/* HOME TAB */}
                                {activeTab === 'home' && (
                                    <div className="space-y-6">
                                        <div className="bg-slate-800/90 p-6 rounded-2xl border border-yellow-500/35 shadow-xl">
                                            <h2 className="text-xl font-bold text-yellow-400 mb-4 flex items-center gap-2">📢 নোটিশ ও ঘোষণা</h2>
                                            <div className="space-y-3">
                                                {notices.length === 0 ? (
                                                    <p className="text-gray-400 text-xs">কোনো নোটিশ পাওয়া যায়নি।</p>
                                                ) : notices.map(n => (
                                                    <div key={n.id} className="bg-slate-700/60 p-4 rounded-xl border border-slate-600/80 shadow">
                                                        <p className="text-gray-100 text-base">{n.text}</p>
                                                        <span className="text-xs text-gray-400 mt-2 block">তারিখ: {n.date}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        {/* Registered Players Table */}
                                        <div className="bg-slate-800/90 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                                <h2 className="text-xl font-extrabold text-yellow-400">📋 রেজিষ্ট্রেশনকৃত খেলোয়ারের তালিকা</h2>
                                                <span className="text-xs bg-slate-700 px-3 py-1 rounded-full text-yellow-300 font-bold">মোট: {getAllRegisteredPlayers().length} জন</span>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-700/80 text-yellow-400 border-b border-slate-600">
                                                            <th className="p-3">ক্রমিক</th>
                                                            <th className="p-3">খেলোয়াড়ের নাম</th>
                                                            <th className="p-3">ক্যাটাগরি</th>
                                                            <th className="p-3">মোবাইল</th>
                                                            <th className="p-3">টিম</th>
                                                            <th className="p-3">গ্রুপ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700 text-gray-200">
                                                        {getAllRegisteredPlayers().map((p, idx) => (
                                                            <tr key={idx} className="hover:bg-slate-700/40">
                                                                <td className="p-3 text-yellow-400 font-bold">#{p.serial}</td>
                                                                <td className="p-3 font-bold text-white">{p.name}</td>
                                                                <td className="p-3">{getCategoryBadge(p.category)}</td>
                                                                <td className="p-3 text-gray-300">{p.phone || 'N/A'}</td>
                                                                <td className="p-3">{p.teamName}</td>
                                                                <td className="p-3 text-yellow-400 font-semibold">{p.groupName}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {/* ADMIN TAB */}
                                {activeTab === 'admin' && !isAdmin && (
                                    <div className="flex justify-center items-center py-10">
                                        <div className="bg-slate-800 p-8 rounded-3xl border border-yellow-500/40 w-full max-w-md shadow-2xl space-y-6">
                                            <h2 className="text-2xl font-black text-yellow-400 text-center">এডমিন লগইন</h2>
                                            {loginError && <p className="text-red-400 text-xs text-center font-bold">{loginError}</p>}
                                            <form onSubmit={handleLogin} className="space-y-4">
                                                <input type="email" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} placeholder="ইমেইল" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm" />
                                                <input type="password" value={passInput} onChange={(e) => setPassInput(e.target.value)} placeholder="পাসওয়ার্ড" required className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white text-sm" />
                                                <button type="submit" className="w-full bg-yellow-500 text-gray-950 font-black py-3 rounded-xl text-sm">লগইন করুন</button>
                                            </form>
                                        </div>
                                    </div>
                                )}

                                {/* ADMIN DASHBOARD */}
                                {activeTab === 'dashboard' && isAdmin && (
                                    <div className="space-y-8">
                                        <div className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/40 shadow-xl space-y-4">
                                            <h3 className="text-lg font-bold text-yellow-400 border-b border-slate-700 pb-2">👤 খেলোয়াড় এন্ট্রি ফরম (Supabase Live Save)</h3>
                                            <form onSubmit={saveSinglePlayer} className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                <select value={singlePlayerForm.group} onChange={e => setSinglePlayerForm({ ...singlePlayerForm, group: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white">
                                                    <option value="গ্রুপ এ">গ্রুপ এ</option>
                                                    <option value="গ্রুপ বি">গ্রুপ বি</option>
                                                    <option value="গ্রুপ সি">গ্রুপ সি</option>
                                                    <option value="গ্রুপ ডি">গ্রুপ ডি</option>
                                                </select>
                                                <input type="text" placeholder="টিমের নাম" value={singlePlayerForm.teamName} onChange={e => setSinglePlayerForm({ ...singlePlayerForm, teamName: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                <input type="text" placeholder="খেলোয়াড়ের নাম *" value={singlePlayerForm.name} onChange={e => setSinglePlayerForm({ ...singlePlayerForm, name: e.target.value })} required className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                <input type="text" placeholder="মোবাইল" value={singlePlayerForm.phone} onChange={e => setSinglePlayerForm({ ...singlePlayerForm, phone: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white" />
                                                <select value={singlePlayerForm.category} onChange={e => setSinglePlayerForm({ ...singlePlayerForm, category: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-yellow-400 font-bold">
                                                    <option value="HIGH">HIGH</option>
                                                    <option value="MEDIUM">MEDIUM</option>
                                                    <option value="LOW">LOW</option>
                                                </select>
                                                <button type="submit" className="bg-yellow-500 text-gray-950 font-bold py-3 rounded-xl text-sm md:col-span-3">Supabase এ ডাটা সেভ করুন</button>
                                            </form>
                                        </div>
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-center p-4 text-xs text-gray-400 border-t border-slate-800">
                        © 2026 Winter Carram Kings Battle. All rights reserved.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
