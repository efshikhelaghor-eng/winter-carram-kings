                                        <input type="text" placeholder="টিমের নাম" value={standingForm.team} onChange={e => setStandingForm({ ...standingForm, team: e.target.value })} required className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <input type="text" placeholder="গ্রুপ" value={standingForm.group} onChange={e => setStandingForm({ ...standingForm, group: e.target.value })} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <input type="number" placeholder="খেলা" value={standingForm.played} onChange={e => setStandingForm({ ...standingForm, played: parseInt(e.target.value) || 0 })} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <input type="number" placeholder="জয়" value={standingForm.won} onChange={e => setStandingForm({ ...standingForm, won: parseInt(e.target.value) || 0 })} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <input type="number" placeholder="হার" value={standingForm.lost} onChange={e => setStandingForm({ ...standingForm, lost: parseInt(e.target.value) || 0 })} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <input type="number" placeholder="পয়েন্ট" value={standingForm.pts} onChange={e => setStandingForm({ ...standingForm, pts: parseInt(e.target.value) || 0 })} className="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                                        <button type="submit" className="bg-gradient-to-r from-yellow-500 to-amber-500 hover:from-yellow-400 text-gray-950 font-bold py-3 rounded-xl text-xs col-span-2 md:col-span-6 transition shadow">
                                            {editingStandingIndex !== null ? 'পয়েন্ট টেবিল আপডেট করুন' : 'পয়েন্ট টেবিলে টিম যোগ করুন'}
                                        </button>
                                    </form>

                                    <div className="space-y-2 mt-4">
                                        <h4 className="text-sm font-semibold text-yellow-300">সকল ১২টি টিমের পয়েন্ট টেবিল ম্যানেজমেন্ট:</h4>
                                        {standings.map((s, idx) => (
                                            <div key={idx} className="bg-slate-900/60 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-xs shadow-inner">
                                                <span><strong className="text-white">{s.team}</strong> (<span className="text-yellow-400">{s.group}</span>) — খেলা: {s.played}, জয়: {s.won}, হার: {s.lost}, পয়েন্ট: <strong className="text-yellow-400">{s.pts}</strong></span>
                                                <div className="flex gap-2">
                                                    <button onClick={() => startEditStanding(idx, s)} className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded-lg font-bold">✏️ এডিট</button>
                                                    <button onClick={() => deleteStanding(idx)} className="bg-red-600 hover:bg-red-700 text-white px-3.5 py-1 rounded-lg font-bold">🗑️ ডিলিট</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900/90 text-center p-4 text-xs text-gray-400 border-t border-slate-800">
                        © 2026 Winter Carram Kings Battle. All rights reserved.
                    </footer>
                </div>
            );
        }

        document.getElementById('root') && ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
