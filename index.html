<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const SUPABASE_URL = "https://ksxzlwiyqullkpndffty.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_bJn8W57PKdo0owl6fV8wgQ_fhKM3XvZ";

        function App() {
            const [activeTab, setActiveTab] = React.useState('home');
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [loading, setLoading] = React.useState(true);
            
            const [adminEmail, setAdminEmail] = React.useState('efshikhelaghor@gmail.com');
            const [adminPassword, setAdminPassword] = React.useState('admin123');

            const [emailInput, setEmailInput] = React.useState('');
            const [passInput, setPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            const [groupsData, setGroupsData] = React.useState({
                'গ্রুপ এ': [],
                'গ্রুপ বি': [],
                'গ্রুপ সি': [],
                'গ্রুপ ডি': []
            });
            const [notices, setNotices] = React.useState([]);

            // Load data via Direct REST API
            const loadData = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/teams?select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    const teams = await res.json();
                    if (Array.isArray(teams)) {
                        const formatted = { 'গ্রুপ এ': [], 'গ্রুপ বি': [], 'গ্রুপ সি': [], 'গ্রুপ ডি': [] };
                        teams.forEach(item => {
                            if (item.group_name && formatted[item.group_name] && item.data) {
                                formatted[item.group_name].push(item.data);
                            }
                        });
                        setGroupsData(formatted);
                    }

                    const noticeRes = await fetch(`${SUPABASE_URL}/rest/v1/notices?select=*`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    const nots = await noticeRes.json();
                    if (Array.isArray(nots)) {
                        setNotices(nots);
                    }
                } catch (e) {
                    console.error("Load error:", e);
                } finally {
                    setLoading(false);
                }
            };

            React.useEffect(() => {
                loadData();
            }, []);

            const [form, setForm] = React.useState({
                name: '', address: '', phone: '', category: 'HIGH', group: 'গ্রুপ এ', teamName: ''
            });

            const handleLogin = (e) => {
                e.preventDefault();
                if (emailInput.trim() === adminEmail && passInput === adminPassword) {
                    setIsAdmin(true);
                    setLoginError('');
                    setActiveTab('dashboard');
                } else {
                    setLoginError('ভুল ইমেইল বা পাসওয়ার্ড!');
                }
            };

            const handleSave = async (e) => {
                e.preventDefault();
                if (!form.name) {
                    alert('খেলোয়াড়ের নাম দিন!');
                    return;
                }

                const groupTeams = groupsData[form.group] || [];
                const newObj = {
                    id: Date.now(),
                    serial: String(groupTeams.length + 1).padStart(2, '0'),
                    teamName: form.teamName || 'টিম ' + (groupTeams.length + 1),
                    address: form.address,
                    player1: form.name,
                    cat1: form.category,
                    phone1: form.phone,
                    player2: 'অপেক্ষমাণ',
                    cat2: 'MEDIUM',
                    phone2: ''
                };

                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/teams`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({
                            id: newObj.id,
                            group_name: form.group,
                            data: newObj
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        alert("সেভ হয়নি: " + (err.message || response.statusText));
                        return;
                    }

                    alert('✅ সফলভাবে ডাটাবেজে সেভ হয়েছে!');
                    setForm({ name: '', address: '', phone: '', category: 'HIGH', group: 'গ্রুপ এ', teamName: '' });
                    loadData();
                } catch (err) {
                    alert("নেটওয়ার্ক এরর!");
                }
            };

            const getAllPlayers = () => {
                let list = [];
                let c = 1;
                Object.keys(groupsData).forEach(g => {
                    groupsData[g].forEach(t => {
                        if (t.player1) {
                            list.push({ serial: String(c++).padStart(2, '0'), ...t, groupName: g });
                        }
                    });
                });
                return list;
            };

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 text-gray-100">
                    {/* Header */}
                    <header className="bg-slate-900 p-4 border-b border-yellow-500/40 flex justify-between items-center sticky top-0 z-50">
                        <div>
                            <h1 className="text-base md:text-xl font-bold text-yellow-400">👑 উইন্টার কিংস ক্যারাম ব্যাটল-২০২৬ইং</h1>
                            <p className="text-xs text-green-400">সরাসরি ডাটাবেজ কানেক্টেড ✅</p>
                        </div>
                        <div>
                            {isAdmin ? (
                                <button onClick={() => { setIsAdmin(false); setActiveTab('home'); }} className="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold">লগআউট</button>
                            ) : (
                                <button onClick={() => setActiveTab('admin')} className="bg-yellow-500 text-gray-950 px-3 py-1.5 rounded text-xs font-bold">এডমিন লগইন</button>
                            )}
                        </div>
                    </header>

                    {/* Nav */}
                    <nav className="flex justify-center bg-slate-800 p-2 gap-2 border-b border-slate-700">
                        <button onClick={() => setActiveTab('home')} className={`px-4 py-1.5 rounded text-sm font-bold ${activeTab === 'home' ? 'bg-yellow-500 text-gray-950' : 'bg-slate-700 text-gray-200'}`}>হোম</button>
                        <button onClick={() => setActiveTab('groups')} className={`px-4 py-1.5 rounded text-sm font-bold ${activeTab === 'groups' ? 'bg-yellow-500 text-gray-950' : 'bg-slate-700 text-gray-200'}`}>গ্রুপ</button>
                        {isAdmin && <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-1.5 rounded text-sm font-bold ${activeTab === 'dashboard' ? 'bg-red-600 text-white' : 'bg-red-900 text-red-200'}`}>এডমিন প্যানেল</button>}
                    </nav>

                    <main className="flex-grow p-4 max-w-4xl mx-auto w-full space-y-6">
                        {loading ? (
                            <div className="text-center py-20 text-yellow-400 font-bold">লোড হচ্ছে...</div>
                        ) : (
                            <>
                                {activeTab === 'home' && (
                                    <div className="space-y-6">
                                        <div className="bg-slate-800 p-4 rounded-xl border border-yellow-500/30">
                                            <h2 className="text-lg font-bold text-yellow-400 mb-3">📢 নোটিশ</h2>
                                            {notices.length === 0 ? <p className="text-xs text-gray-400">কোনো নোটিশ নেই।</p> : notices.map(n => (
                                                <div key={n.id} className="bg-slate-700 p-3 rounded mb-2">
                                                    <p className="text-sm">{n.text}</p>
                                                    <span className="text-[10px] text-gray-400">{n.date}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                            <h2 className="text-lg font-bold text-yellow-400 mb-3">📋 নিবন্ধিত খেলোয়াড়বৃন্দ (মোট: {getAllPlayers().length} জন)</h2>
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-xs md:text-sm">
                                                    <thead>
                                                        <tr className="bg-slate-700 text-yellow-400">
                                                            <th className="p-2">ক্রমিক</th>
                                                            <th className="p-2">নাম</th>
                                                            <th className="p-2">ক্যাটাগরি</th>
                                                            <th className="p-2">মোবাইল</th>
                                                            <th className="p-2">টিম</th>
                                                            <th className="p-2">গ্রুপ</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700">
                                                        {getAllPlayers().length === 0 ? (
                                                            <tr><td colSpan="6" className="p-4 text-center text-gray-400">কোনো খেলোয়াড় নেই।</td></tr>
                                                        ) : getAllPlayers().map((p, i) => (
                                                            <tr key={i}>
                                                                <td className="p-2 text-yellow-400 font-bold">#{p.serial}</td>
                                                                <td className="p-2 font-bold">{p.player1}</td>
                                                                <td className="p-2"><span className="px-1.5 py-0.5 rounded bg-red-500/20 text-red-400 text-xs">{p.cat1}</span></td>
                                                                <td className="p-2">{p.phone1 || 'N/A'}</td>
                                                                <td className="p-2">{p.teamName}</td>
                                                                <td className="p-2 text-yellow-400">{p.groupName}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'groups' && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {Object.keys(groupsData).map(g => (
                                            <div key={g} className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                                <h3 className="font-bold text-yellow-400 border-b border-slate-700 pb-2 mb-3">{g}</h3>
                                                {groupsData[g].length === 0 ? <p className="text-xs text-gray-400">খালি</p> : groupsData[g].map((t, i) => (
                                                    <div key={i} className="bg-slate-700/50 p-2 rounded mb-2 flex justify-between text-xs">
                                                        <div>
                                                            <p className="font-bold">{t.teamName}</p>
                                                            <p className="text-gray-300">👤 {t.player1}</p>
                                                        </div>
                                                        <span>{t.phone1}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {activeTab === 'admin' && !isAdmin && (
                                    <div className="flex justify-center py-10">
                                        <form onSubmit={handleLogin} className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/40 w-full max-w-sm space-y-4">
                                            <h2 className="text-xl font-bold text-yellow-400 text-center">এডমিন লগইন</h2>
                                            {loginError && <p className="text-red-400 text-xs text-center font-bold">{loginError}</p>}
                                            <input type="email" value={emailInput} onChange={e => setEmailInput(e.target.value)} placeholder="ইমেইল" required className="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm" />
                                            <input type="password" value={passInput} onChange={e => setPassInput(e.target.value)} placeholder="পাসওয়ার্ড" required className="w-full bg-slate-950 border border-slate-700 rounded p-2.5 text-sm" />
                                            <button type="submit" className="w-full bg-yellow-500 text-gray-950 font-bold py-2.5 rounded text-sm">লগইন করুন</button>
                                        </form>
                                    </div>
                                )}

                                {activeTab === 'dashboard' && isAdmin && (
                                    <div className="bg-slate-800 p-6 rounded-2xl border border-yellow-500/40 space-y-4">
                                        <h3 className="text-base font-bold text-yellow-400 border-b border-slate-700 pb-2">👤 খেলোয়াড় এন্ট্রি ফরম</h3>
                                        <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                            <select value={form.group} onChange={e => setForm({...form, group: e.target.value})} className="bg-slate-900 border border-slate-700 rounded p-2.5 text-sm">
                                                <option value="গ্রুপ এ">গ্রুপ এ</option>
                                                <option value="গ্রুপ বি">গ্রুপ বি</option>
                                                <option value="গ্রুপ সি">গ্রুপ সি</option>
                                                <option value="গ্রুপ ডি">গ্রুপ ডি</option>
                                            </select>
                                            <input type="text" placeholder="টিমের নাম" value={form.teamName} onChange={e => setForm({...form, teamName: e.target.value})} className="bg-slate-900 border border-slate-700 rounded p-2.5 text-sm" />
                                            <input type="text" placeholder="খেলোয়াড়ের নাম *" value={form.name} onChange={e => setForm({...form, name: e.target.value})} required className="bg-slate-900 border border-slate-700 rounded p-2.5 text-sm" />
                                            <input type="text" placeholder="মোবাইল" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} className="bg-slate-900 border border-slate-700 rounded p-2.5 text-sm" />
                                            <select value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="bg-slate-900 border border-slate-700 rounded p-2.5 text-sm text-yellow-400 font-bold">
                                                <option value="HIGH">HIGH</option>
                                                <option value="MEDIUM">MEDIUM</option>
                                                <option value="LOW">LOW</option>
                                            </select>
                                            <button type="submit" className="bg-yellow-500 text-gray-950 font-bold py-2.5 rounded text-sm md:col-span-3">ডাটাবেজে সেভ করুন</button>
                                        </form>
                                    </div>
                                )}
                            </>
                        )}
                    </main>

                    <footer className="bg-slate-900 text-center p-3 text-[11px] text-gray-400 border-t border-slate-800">
                        © 2026 Winter Carram Kings Battle
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
